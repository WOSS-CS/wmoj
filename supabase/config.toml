# Supabase local development stack for wmoj-app.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# Deliberately minimal. Only the services the app actually talks to are enabled, so
# `supabase start` stays light on a laptop. Everything turned off below is turned off
# because nothing in main/src uses it -- see docs/local-development.md.

project_id = "wmoj-app"

# ---------------------------------------------------------------------------
# Data API (Kong + PostgREST). Every query the app makes goes through this.
# ---------------------------------------------------------------------------
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
# `extensions` must stay on the search path: uuid-ossp, pgcrypto and pg_stat_statements
# are all installed into that schema by the baseline migration.
extra_search_path = ["public", "extensions"]
max_rows = 1000

# ---------------------------------------------------------------------------
# Postgres. major_version MUST match production (Postgres 17).
# ---------------------------------------------------------------------------
[db]
port = 54322
shadow_port = 54320
major_version = 17

# The app reaches Postgres only through PostgREST, never over a direct connection,
# so the Supavisor pooler would be a container nothing dials.
[db.pooler]
enabled = false

[db.migrations]
enabled = true

# No seed file is checked in: a local database is production's shape with empty tables.
# Drop a supabase/seed.sql in if you want fixtures; `supabase db reset` will load it.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# ---------------------------------------------------------------------------
# Auth (GoTrue). Email + password only.
# ---------------------------------------------------------------------------
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
# Matches the 6-character floor the signup and reset-password forms enforce.
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
# No inbox round trip on signup: register and you are signed in immediately.
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[auth.rate_limit]
# The 2-per-hour default makes /auth/forgot-password untestable after two tries.
email_sent = 100
sign_in_sign_ups = 100
token_refresh = 150
token_verifications = 100

[auth.sms]
enable_signup = false
enable_confirmations = false

# Mailpit. Catches every mail GoTrue sends (password reset, email change) and serves
# it at http://127.0.0.1:54324. Nothing leaves the machine. ~12 MB.
[local_smtp]
enabled = true
port = 54324

# ---------------------------------------------------------------------------
# Storage. The `avatars` and `problem_images` buckets are created by the migrations,
# not here, so that local and production come from the same source.
# ---------------------------------------------------------------------------
[storage]
enabled = true
file_size_limit = "50MiB"

# The app uses the Storage REST API (`supabase.storage.from(...)`); no S3 client exists.
[storage.s3_protocol]
enabled = false

# Pro-plan vector buckets. Unused.
[storage.vector]
enabled = false

# ---------------------------------------------------------------------------
# Studio, the local stand-in for the hosted dashboard: table editor, SQL editor,
# auth user list. Not needed by the app; kept because the setup docs point at it.
# Turn it off (with pg_meta, which it drives) to save ~300 MB.
# ---------------------------------------------------------------------------
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# ---------------------------------------------------------------------------
# Off on purpose. Each is a container the app never speaks to.
# ---------------------------------------------------------------------------

# Zero `.channel()` / `postgres_changes` subscriptions in main/src. ~190 MB.
[realtime]
enabled = false

# No supabase/functions/ directory and no `functions.invoke()` call anywhere; all
# server-side logic is Next.js route handlers. ~25 MB plus a Deno process.
[edge_runtime]
enabled = false

# Logflare + Vector log pipeline. Pure observability, nothing reads it, and it is by
# far the heaviest piece of the stack (~530 MB). `docker logs supabase_auth_wmoj-app`
# and friends cover local debugging. `supabase logs` needs this back on.
[analytics]
enabled = false
